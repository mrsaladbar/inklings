<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Pad</title>
<style>
  :root { --bg: #eceef4; --fg: #1d1f24; --muted: #5d6270; --paper: #f8f6fc; --ok: #1e7d3a; --bad: #b3261e; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 12px 16px; gap: 8px; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #status { font-weight: 600; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  canvas { background: var(--paper); border: 1px solid #c9ccd6; border-radius: 8px; touch-action: none;
           height: min(80vh, 900px); max-width: 100%; aspect-ratio: 1080 / 2170; cursor: crosshair; }
  small { color: var(--muted); }
</style>
</head>
<body>
<header>
  <strong>Relay Pad</strong>
  <span id="status">connecting…</span>
  <label>Color <input id="color" type="color" value="#1565c0"></label>
  <button id="clear">Clear</button>
</header>
<small>Pretends to be a second phone (1080×2170 canvas, same shape as the emulator). Speaks protocol v0: strokes stream live both ways in 50 ms batches; late joiners get the current canvas.</small>
<canvas id="pad" width="1080" height="2170"></canvas>
<script>
const pad = document.getElementById("pad"), ctx = pad.getContext("2d");
const statusEl = document.getElementById("status");

// Every stroke on the canvas, oldest first, as protocol data: points are [x, y, ms] with
// x and y in 0..1. Strokes still being drawn (by us or anyone else) are in here too.
const strokes = [];
let ws;

function connect() {
  ws = new WebSocket("ws://localhost:8080/relay");
  ws.onopen = () => { statusEl.textContent = "connected"; statusEl.className = "ok"; };
  ws.onclose = () => { statusEl.textContent = "disconnected, retrying…"; statusEl.className = "bad"; setTimeout(connect, 1500); };
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch {} };
}

// Remote strokes, keyed by the server's strokeId.
const remote = new Map();

function handle(m) {
  switch (m.type) {
    case "canvas_snapshot":
      strokes.length = 0; remote.clear();
      (m.strokes || []).forEach((s) => { const c = { ...s, points: [...s.points] }; strokes.push(c); remote.set(s.strokeId, c); });
      redraw();
      break;
    case "stroke": {
      let s = remote.get(m.strokeId);
      if (!s) { s = { ...m, points: [] }; remote.set(m.strokeId, s); strokes.push(s); }
      s.points.push(...m.points); s.done = m.done;
      redraw();
      break;
    }
    case "undo":
      strokes.pop(); redraw();
      break;
    case "clear":
      strokes.length = 0; remote.clear(); redraw();
      break;
    case "error":
      console.warn("server error", m.code, m.message);
      break;
  }
}

const WIDTH_FOR_SIZE = { 1: 2, 2: 5, 3: 10 }; // same as the app's toolbar

function draw(s) {
  if (!s.points?.length) return;
  ctx.strokeStyle = s.color;
  ctx.lineWidth = WIDTH_FOR_SIZE[s.size] || 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  s.points.forEach(([x, y], i) => {
    const px = x * pad.width, py = y * pad.height;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  if (s.points.length === 1) ctx.lineTo(s.points[0][0] * pad.width + 0.1, s.points[0][1] * pad.height);
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0, 0, pad.width, pad.height);
  strokes.forEach(draw);
}

// Drawing: our own strokes, streamed in 50 ms batches like the app does.
let current = null, pending = [], t0 = 0, nextId = 1, timer = null;
const send = (msg) => { if (ws?.readyState === 1) ws.send(JSON.stringify(msg)); };
const toPoint = (e) => {
  const r = pad.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  return [x, y, Math.round(e.timeStamp - t0)];
};
const flush = (done) => {
  if (!current || (!pending.length && !done)) return;
  send({ type: "stroke", strokeId: current.strokeId, points: pending, color: current.color, size: current.size, done });
  pending = [];
};
pad.addEventListener("pointerdown", (e) => {
  pad.setPointerCapture(e.pointerId);
  const color = document.getElementById("color").value.toUpperCase();
  current = { strokeId: nextId++, color, size: 3, points: [], done: false };
  strokes.push(current);
  t0 = e.timeStamp;
  timer = setInterval(() => flush(false), 50);
  add(e);
});
pad.addEventListener("pointermove", (e) => { if (current) add(e); });
pad.addEventListener("pointerup", () => {
  if (!current) return;
  clearInterval(timer);
  flush(true);
  current.done = true; current = null;
  redraw();
});
function add(e) {
  const p = toPoint(e), last = current.points.at(-1);
  if (last && last[0] === p[0] && last[1] === p[1]) return;
  current.points.push(p); pending.push(p);
  redraw();
}
document.getElementById("clear").onclick = () => {
  strokes.length = 0; remote.clear(); redraw();
  send({ type: "clear" });
};
connect();
</script>
</body>
</html>
